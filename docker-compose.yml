services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bnav
      POSTGRES_PASSWORD: bnav
      POSTGRES_DB: bureaucracy_navigator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bnav:bnav@postgres:5432/bureaucracy_navigator
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis

  worker:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bnav:bnav@postgres:5432/bureaucracy_navigator
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
